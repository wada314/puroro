[package]
name = "puroro-sample-generated"
version = "0.0.0"
edition = "2024"
publish = false
description = "Hand-written sample of puroro protoc plugin output (Task / Address)"

[lints]
workspace = true

[features]
default = []
# Opt-in encoded `FileDescriptorSet` as `descriptors::FILE_DESCRIPTOR_SET`.
descriptors = []

[dependencies]
allocator-api2 = "0.2"
bitvec = "1"
bytes = "1"
puroro = { path = ".." }
puroro-rt = { path = "../puroro-rt" }

[dev-dependencies]
http-body = "1"
# Enables `puroro`'s `tonic` feature for `tests/tonic_codec.rs` (unified with
# the path dependency above when running this package's tests).
puroro = { path = "..", features = ["tonic"] }
tokio = { version = "1", features = ["macros", "rt"] }
tonic = { version = "0.14", default-features = false }
