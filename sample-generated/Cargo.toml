[package]
name = "puroro-sample-generated"
version = "0.0.0"
edition = "2024"
publish = false
description = "Hand-written sample of puroro protoc plugin output (Task / Address)"

[lints]
workspace = true

[features]
default = []
# Mirrors generated crates: opt-in FileDescriptorSet helpers on `puroro`.
descriptors = ["puroro/descriptors"]

[dependencies]
allocator-api2 = "0.2"
bitvec = "1"
bytes = "1"
puroro = { path = "..", default-features = false }
puroro-rt = { path = "../puroro-rt" }

[dev-dependencies]
