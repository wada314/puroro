syntax = "proto2";

package puroro;

import "google/protobuf/descriptor.proto";

// Layout of a singular `string` field in generated Rust.
//
// Unset and `STRING_LAYOUT_UNSPECIFIED` let the generator pick the default
// (currently SSO / `InlineOrHeap`). `STRING_LAYOUT_SSO` and
// `STRING_LAYOUT_HEAP` pin the layout. Non-`string` fields ignore this option.
enum StringLayout {
  STRING_LAYOUT_UNSPECIFIED = 0;
  STRING_LAYOUT_SSO = 1;
  STRING_LAYOUT_HEAP = 2;
}

// Layout of a singular `bytes` field in generated Rust.
//
// Unset and `BYTES_LAYOUT_UNSPECIFIED` let the generator pick the default
// (currently SSO / `InlineOrHeap`). `BYTES_LAYOUT_SSO` and
// `BYTES_LAYOUT_HEAP` pin the layout. Non-`bytes` fields ignore this option.
enum BytesLayout {
  BYTES_LAYOUT_UNSPECIFIED = 0;
  BYTES_LAYOUT_SSO = 1;
  BYTES_LAYOUT_HEAP = 2;
}

// Layout of a singular nested message field in generated Rust.
//
// Unset and `MESSAGE_LAYOUT_UNSPECIFIED` let the generator pick (auto-inline
// a tiny scalar-only child, otherwise boxed). `MESSAGE_LAYOUT_INLINE` requests
// embedding; `MESSAGE_LAYOUT_BOXED` pins a heap box. Oneof / repeated / map /
// same-SCC (recursive) fields always box and ignore INLINE.
enum MessageLayout {
  MESSAGE_LAYOUT_UNSPECIFIED = 0;
  MESSAGE_LAYOUT_INLINE = 1;
  MESSAGE_LAYOUT_BOXED = 2;
}

extend google.protobuf.FieldOptions {
  // Custom-option numbers 50000–99999 are for internal use.
  optional StringLayout string_layout = 51400;
  optional BytesLayout bytes_layout = 51401;
  optional MessageLayout message_layout = 51402;
}
