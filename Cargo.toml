[workspace]
members = [".", "puroro-rt", "protobuf-core", "protoc-gen-puroro", "puroro-codegen-tests", "sample-generated", "unmanaged"]
resolver = "2"

[workspace.lints.clippy]
# Restriction lint (allow by default). Do not opt git submodules into this.
absolute_paths = "warn"

[package]
name = "puroro"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

# Do not run the default libtest bench harness on the library target
# (`cargo bench` should only run Criterion targets below).
[lib]
bench = false

[dependencies]
allocator-api2 = "0.2"
bytes = "1"
protobuf-core = { path = "protobuf-core" }
unmanaged = { path = "unmanaged" }

[dev-dependencies]
bitvec = "1"
# Same stack as the historical `puroro/benches/variant.rs` setup.
criterion = { version = "0.5.1", features = ["html_reports"] }
puroro-rt = { path = "puroro-rt" }
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"

[[bench]]
name = "ser_de"
harness = false

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "string_layout"
harness = false
