[workspace]
members = [".", "puroro-rt", "puroro-benches", "protobuf-core", "protoc-gen-puroro", "puroro-codegen-tests", "sample-generated", "unmanaged", "archive/address-view-spike"]
resolver = "2"

[workspace.lints.clippy]
# Restriction lint (allow by default). Do not opt git submodules into this.
absolute_paths = "warn"

[package]
name = "puroro"
version = "0.15.0"
authors = ["Shohei Wada <pc@wada314.jp>"]
edition = "2024"
license = "Apache-2.0"
description = "Experimental Protocol Buffers runtime for Rust. Not a Google product; most users should use google-protobuf."
repository = "https://github.com/wada314/puroro"
readme = "README.md"
# Cargo would otherwise treat `benches/` as targets of this package. Those
# sources live in `puroro-benches` so publishing `puroro` does not need `puroro-rt`.
autobenches = false
exclude = ["puroro-benches"]

[lints]
workspace = true

# Do not run the default libtest bench harness on the library target.
# Criterion targets live in `puroro-benches` so this package can be published
# before `puroro-rt` (a dev-dependency here would be a publish cycle).
[lib]
bench = false

[dependencies]
allocator-api2 = "0.2"
bytes = "1"
protobuf-core = { path = "protobuf-core", version = "0.3.0" }
unmanaged = { path = "unmanaged", version = "0.1.0" }
