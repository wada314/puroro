[workspace]
members = [".", "puroro-rt", "protobuf-core", "sample-generated", "unmanaged"]
resolver = "2"

[workspace.lints.clippy]
# Restriction lint (allow by default). Do not opt git submodules into this.
absolute_paths = "warn"

[package]
name = "puroro"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
allocator-api2 = "0.2"
bytes = "1"
protobuf-core = { path = "protobuf-core" }
unmanaged = { path = "unmanaged" }
