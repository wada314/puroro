syntax = "proto3";

message Peer {
  optional string name = 1;
  // Second field lets tests distinguish map last-wins *replace* from
  // singular-message field-merge when the same map key appears twice.
  optional int32 age = 2;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_A = 1;
  KIND_B = 2;
}

message Holder {
  map<string, int32> attributes = 1;
  map<int32, bool> flags = 2;
  map<bool, uint64> counters = 3;
  map<int32, string> labels = 4;
  map<int32, bytes> blobs = 5;
  map<int32, Kind> kinds = 6;
  map<int32, Peer> peers = 7;
  map<string, string> aliases = 8;
  // Remaining legal integral / fixed key types (values stay int32 for brevity).
  map<uint32, int32> u32_keys = 9;
  map<uint64, int32> u64_keys = 10;
  map<sint32, int32> s32_keys = 11;
  map<sint64, int32> s64_keys = 12;
  map<fixed32, int32> f32_keys = 13;
  map<fixed64, int32> f64_keys = 14;
  map<sfixed32, int32> sf32_keys = 15;
  map<sfixed64, int32> sf64_keys = 16;
}
