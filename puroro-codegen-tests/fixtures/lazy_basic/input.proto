syntax = "proto3";

import "puroro/options.proto";

message Child {
  int32 n = 1;
}

message Note {
  int32 score = 1;
  string title = 2;
  Child child = 3;
  Child pinned = 4 [(puroro.child_parse) = CHILD_PARSE_LAZY];
  repeated string labels = 5;
}

// Message-level default: every unspecified child field stores Lazy.
message Board {
  option (puroro.message_child_parse) = CHILD_PARSE_LAZY;
  int32 id = 1;
  Child note = 2;
}
