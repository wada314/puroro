[package]
name = "puroro-codegen-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compile-time generation + runtime tests for protoc-gen-puroro"

[lib]
# Fixtures `include!` generated sources whose proto comments are not Rust examples.
doctest = false

[lints]
workspace = true

[features]
default = []
# Matches generated crates' opt-in `descriptors` cfg (FILE_DESCRIPTOR_SET).
descriptors = []
# Compiles generated `{service}_client` / `{service}_server` modules (cfg-gated
# in plugin output) and runs the in-process unary round-trip. Also enables
# `puroro/tonic` for `PuroroCodec`.
tonic = ["dep:tonic", "dep:tokio", "puroro/tonic"]

[dependencies]
allocator-api2 = "0.2"
bitvec = "1"
bytes = "1"
puroro = { path = ".." }
# Fixtures that set `puroro_opt` to `lazy=true` need the experimental feature.
puroro-rt = { path = "../puroro-rt", features = ["lazy"] }
tonic = { version = "0.14", optional = true }
# Loopback `Server` / `Channel` for the grpc_helloworld unary round-trip.
tokio = { version = "1", optional = true, default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
] }

# Host plugin binary for the build script (`CARGO_BIN_FILE_PROTOC_GEN_PURORO`).
# Requires nightly Cargo `-Z bindeps` (enabled via `.cargo/config.toml`).
[build-dependencies]
protoc-gen-puroro = { path = "../protoc-gen-puroro", artifact = "bin" }
