[package]
name = "puroro-tonic"
version = "0.1.0"
authors = ["Shohei Wada <pc@wada314.jp>"]
edition = "2024"
license = "Apache-2.0"
description = "tonic Codec for puroro protobuf messages"
repository = "https://github.com/wada314/puroro"
readme = "README.md"
keywords = ["rpc", "grpc", "protobuf", "tonic", "puroro"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
puroro = { path = "..", version = "0.15.0" }
tonic = { version = "0.14", default-features = false }

[dev-dependencies]
bytes = "1"
http-body = "1"
puroro-sample-generated = { path = "../sample-generated" }
tokio = { version = "1", features = ["macros", "rt"] }
